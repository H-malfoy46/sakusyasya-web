<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>交換票 | サク写シャッ!</title>
<meta property="og:title" content="サク写シャッ! の交換票">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>サク写シャッ! 交換票</header>
<main>
  <div id="ended" class="card error" hidden>
    無料公開の期間は終了しました（11/21 12:00 まで）。ご利用ありがとうございました。
  </div>
  <div id="error" class="card error" hidden></div>

  <div id="app" hidden>
    <!-- 自分の交換票を作る -->
    <section id="edit" class="card">
      <input id="name" class="input" type="text" maxlength="20" placeholder="名前" autocomplete="off">
      <div class="tabs">
        <button id="tabWant" class="want on" type="button">求</button>
        <button id="tabGive" class="give" type="button">譲</button>
      </div>
      <div id="scenes"></div>
    </section>

    <section class="card">
      <button id="showQr" class="btn" type="button">二次元コードを表示</button>
      <button id="scan" class="btn secondary" type="button">相手のコードを読み取る</button>
    </section>

    <!-- 自分の二次元コード -->
    <section id="qrcard" class="card center" hidden>
      <div id="qr"></div>
      <div class="actions">
        <button id="copy" class="btn secondary" type="button">リンクをコピー</button>
        <button id="share" class="btn secondary" type="button">共有</button>
      </div>
    </section>

    <!-- 読み取り履歴 -->
    <section id="history" class="card" hidden>
      <div class="heading">読み取り履歴</div>
      <div id="historyList"></div>
    </section>

    <!-- 相手のコードを読む -->
    <section id="scanner" class="card center" hidden>
      <video id="video" playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <label class="btn secondary" for="photo">写真から読み取る</label>
      <input id="photo" type="file" accept="image/*" hidden>
      <button id="stopScan" class="btn secondary" type="button">閉じる</button>
    </section>

    <!-- 使い方の注意 -->
    <section class="card">
      <p class="muted">・「譲」の写真は、長押しすると枚数がリセットされます（削除の確認が出ます）</p>
      <p class="muted">・交換票はユーザーに紐づいていません。交換票を更新したら、二次元コードをもう一度発行してください</p>
    </section>

  </div>
  <div id="toast" class="toast" hidden></div>
</main>
<footer>サク写シャッ! は非公式のファンアプリです<br><a href="https://sites.google.com/view/sakusyashh-privacy-policy" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>　<a href="https://x.com/h_malfoy46" target="_blank" rel="noopener noreferrer">X</a></footer>
<script src="vendor/qrcode-generator-1.4.4.js"></script>
<script src="vendor/jsQR-1.4.0.js"></script>
<script type="module" src="js/home.js"></script>
</body>
</html>
